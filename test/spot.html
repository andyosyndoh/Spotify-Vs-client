<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Extension Core Simulator</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { corePlugins: { preflight: false } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #2a3b3a;
            color: white;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body.fullscreen-mode {
            cursor: none;
        }

        body.fullscreen-mode.show-controls {
            cursor: default;
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.3);
            z-index: -1;
            transition: all 0.8s ease;
            image-rendering: auto;
        }

        .cont {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .spotify-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
        }

        .refresh-button,
        .fullscreen-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .refresh-button:hover,
        .fullscreen-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .logout-button {
            background: rgba(220, 38, 38, 0.8);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .logout-button:hover {
            background: rgba(220, 38, 38, 1);
            transform: scale(1.05);
        }

        .spotify-button {
            background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
            color: white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 600;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }

        .spotify-button:hover {
            background: linear-gradient(135deg, #1ed760 0%, #1fdf64 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .album-art-main {
            width: 400px;
            height: 400px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .album-art-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .progress-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: #1DB954;
            width: 0%;
            transition: width 0.3s ease;
        }

        .track-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .track-artist {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
        }

        .track-album {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 50px;
        }

        .controls-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding-bottom: 40px;
            width: 100%;
            max-width: 600px;
        }

        .control-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            backdrop-filter: blur(10px);
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .control-button.play-pause {
            width: 80px;
            height: 80px;
            background: #1DB954;
            font-size: 28px;
        }

        .control-button.play-pause:hover {
            background: #1ed760;
            box-shadow: 0 8px 25px rgba(29, 185, 84, 0.4);
        }

        .auth-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .auth-message {
            font-size: 18px;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.8);
        }

        .hidden {
            display: none !important;
        }

        .error-box {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        /* Explicit Badge */
        .explicit-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        /* QR Code */
        .qr-container {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .qr-title {
            color: #000;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
        }

        #qr-code {
            width: 150px;
            height: 150px;
        }

        #qr-code img {
            width: 100%;
            height: 100%;
        }

        /* Fullscreen Mode Styles */
        body.fullscreen-mode .background-image {
            filter: blur(40px) brightness(0.35) saturate(1.2) !important;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: scale(1.1);
        }

        body.fullscreen-mode .main-content {
            display: none;
        }

        body.fullscreen-mode .controls-bottom {
            display: none;
        }

        body.fullscreen-mode.show-controls .header {
            opacity: 1;
            pointer-events: auto;
        }

        body.fullscreen-mode .header {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            z-index: 300;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
            margin-bottom: 0;
        }

        body.fullscreen-mode .header .refresh-button,
        body.fullscreen-mode .header .fullscreen-button,
        body.fullscreen-mode .header .logout-button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .vibe-signature {
            position: fixed;
            top: 26px;
            left: 30px;
            z-index: 340;
            display: none;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(14px);
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        }

        body.fullscreen-mode .vibe-signature {
            display: block;
        }

        .track-change-overlay {
            position: fixed;
            inset: 0;
            z-index: 360;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 32px 40px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .track-change-overlay.visible {
            opacity: 1;
        }

        body.track-overlay-active .background-image {
            filter: blur(56px) brightness(0.22) saturate(1.28) !important;
        }

        .track-change-backdrop {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 16% 48%, rgba(var(--track-glow-rgb, 29, 185, 84), 0.36), transparent 34%),
                radial-gradient(circle at 82% 14%, rgba(255, 255, 255, 0.08), transparent 26%),
                rgba(4, 4, 6, 0.34);
            backdrop-filter: blur(38px) saturate(1.12);
            -webkit-backdrop-filter: blur(38px) saturate(1.12);
        }

        .track-change-card {
            position: relative;
            display: grid;
            grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);
            align-items: center;
            gap: 24px;
            width: min(84vw, 920px);
            padding: 24px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(8, 8, 8, 0.82), rgba(20, 20, 24, 0.42));
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(24px);
            box-shadow:
                0 28px 90px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 90px rgba(var(--track-glow-rgb, 29, 185, 84), 0.26);
            transform: translateX(-90px) scale(0.97);
            opacity: 0;
            overflow: hidden;
        }

        .track-change-card::after {
            content: '';
            position: absolute;
            right: -16%;
            bottom: -34%;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(var(--track-glow-rgb, 29, 185, 84), 0.42), transparent 70%);
            filter: blur(12px);
            pointer-events: none;
        }

        .track-change-art-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 22px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 22px 42px rgba(0, 0, 0, 0.34);
            z-index: 1;
        }

        .track-change-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-change-copy {
            position: relative;
            z-index: 1;
        }

        .track-change-overlay.visible .track-change-card {
            animation: trackChangeReveal 3.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .track-change-kicker {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .track-change-artist {
            font-size: clamp(38px, 7vw, 92px);
            font-weight: 700;
            line-height: 0.94;
            color: white;
            text-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .track-change-song {
            font-size: clamp(14px, 1.8vw, 20px);
            color: rgba(255, 255, 255, 0.68);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        @keyframes trackChangeReveal {
            0% {
                opacity: 0;
                transform: translateX(-90px) scale(0.96);
                filter: blur(10px);
            }
            12% {
                opacity: 1;
                transform: translateX(0) scale(1);
                filter: blur(0);
            }
            78% {
                opacity: 1;
                transform: translateX(0) scale(1);
                filter: blur(0);
            }
            100% {
                opacity: 0;
                transform: translateX(38px) scale(1.01);
                filter: blur(8px);
            }
        }

        /* ── Fullscreen Two-Panel Layout ── */
        .fs-panel {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        body.fullscreen-mode .fs-panel {
            display: flex;
        }

        /* Left panel: artist card */
        .fs-left {
            flex: 0 0 52%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            height: 100vh;
            padding: 20px 20px 20px 60px;
        }

        .fs-artist-card {
            position: relative;
            width: 100%;
            max-width: 640px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }

        .fs-qr-container {
            width: 100%;
            max-width: 220px;
            background: rgba(var(--track-glow-rgb, 29, 185, 84), 0.18);
            border: 1.5px solid rgba(var(--track-glow-rgb, 29, 185, 84), 0.38);
            padding: 14px;
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(var(--track-glow-rgb, 29, 185, 84), 0.28), 0 16px 36px rgba(0, 0, 0, 0.36);
            transition: background 0.8s ease, box-shadow 0.8s ease, border-color 0.8s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .fs-qr-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        #fs-qr-code {
            width: 160px;
            height: 160px;
        }

        #fs-qr-code img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .fs-artist-img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: auto;
        }

        .fs-artist-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 45%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px 22px;
            color: white;
        }

        .fs-artist-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .fs-artist-big-name {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .fs-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .genre-tag {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.9);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }

        .fs-meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .fs-bio {
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.65);
            display: -webkit-box;
            line-clamp: 4;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 10px;
            margin-top: 2px;
        }

        /* Right panel: album art + track info + controls */
        .fs-right {
            flex: 0 0 48%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 44px 60px 28px 48px;
            gap: 20px;
            height: 100vh;
        }

        .fs-album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fs-track-block {
            text-align: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        .fs-song-name {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 420px;
        }

        .fs-artist-name {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 4px;
        }

        .fs-album-name {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        .fs-progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 520px;
            margin-top: auto;
            padding-top: 8px;
        }

        .fs-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            min-width: 36px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .fs-progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }

        .fs-progress-fill {
            height: 100%;
            background: #1DB954;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .fs-controls {
            display: flex;
            align-items: center;
            gap: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.fullscreen-mode.show-controls .fs-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .fs-controls .control-button {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        }

        .fs-controls .control-button:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.45);
            transform: scale(1.12);
        }

        .fs-controls .control-button.play-pause {
            background: rgba(29, 185, 84, 0.9);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
        }

        .fs-album-wrap {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
            flex-shrink: 0;
        }

        .fs-controls .control-button.play-pause:hover {
            background: #1ed760;
            box-shadow: 0 8px 36px rgba(29, 185, 84, 0.55);
        }

        .fs-album-details {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            backdrop-filter: blur(18px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            padding: 16px;
        }

        .fs-album-details-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .fs-detail-card {
            min-height: 86px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
        }

        .fs-stat-label,
        .fs-section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 8px;
        }

        .fs-stat-value {
            color: white;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .fs-stat-subvalue {
            color: rgba(255, 255, 255, 0.58);
            font-size: 12px;
            line-height: 1.4;
        }

        .fs-top-tracks {
            width: 100%;
            max-width: 520px;
            padding: 16px;
        }

        .fs-top-track-list {
            display: grid;
            gap: 8px;
        }

        .fs-top-track-item {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .fs-top-track-item:first-child {

    <!-- Firebase Imports for persistent storage (simulation only) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- GLOBAL VARIABLES (Provided by Canvas Environment) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : undefined;
        // ---------------------------------------------------------

        // Spotify Configuration (MUST be replaced with your own)
        // >>> PASTE YOUR SPOTIFY CLIENT ID HERE <<<
        // Load from environment or use placeholder
        const SPOTIFY_CLIENT_ID = '__SPOTIFY_CLIENT_ID__'; // Will be replaced by build script
        // Common redirect URIs - match exactly what's in your Spotify Dashboard:
        // For Live Server (default): http://127.0.0.1:5500/test/spot.html
        // For file:// protocol: use http://127.0.0.1:5500/test/spot.html and run a server
        const SPOTIFY_REDIRECT_URI = 'http://127.0.0.1:5500/test/spot.html';
        const SCOPES = 'user-read-playback-state user-modify-playback-state';

        // Firebase Initialization
        let app, db, auth, userId;
        const TOKEN_DOC_PATH = `/artifacts/${appId}/users/`;
        const TOKEN_DOC_ID = 'spotify_token';
        
        // Progress tracking variables
        let localProgressMs = 0;
        let lastUpdateTime = 0;
        let progressInterval = null;

        // Wake Lock API to prevent screen from sleeping
        let wakeLock = null;

        // Artist tracking
        let currentArtistId = null;
        let currentArtistImage = null;
        let currentArtistDetails = null;
        let currentAlbumId = null;
        let currentAlbumDetails = null;
        let currentArtistTopTracks = [];
        let currentTrackId = null;
        let trackChangeOverlayTimeout = null;

        // Cursor tracking for fullscreen controls
        let cursorTimeout = null;
        let isFullscreenMode = false;

        // Expose functions to global scope
        window.handleLogin = handleLogin;
        window.controlPlayback = controlPlayback;
        window.togglePlayback = togglePlayback;
        window.getCurrentlyPlaying = getCurrentlyPlaying;
        window.toggleFullscreen = toggleFullscreen;
        window.handleLogout = handleLogout;

        // Utility to display errors
        function displayError(message) {
            console.error(message);
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-box').classList.remove('hidden');
        }

        // --- 1. FIREBASE & AUTHENTICATION SETUP ---

        async function initializeFirebase() {
            try {
                if (Object.keys(firebaseConfig).length === 0) {
                    console.warn("Firebase config is missing. Using localStorage for token persistence.");
                    userId = 'local-user';
                    await loadTokenAndHandleAuthFlow();
                    return;
                }
                setLogLevel('Debug');
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                userId = auth.currentUser?.uid || crypto.randomUUID();
                console.log("Firebase initialized. User ID:", userId);

                // Check for Spotify token immediately after Firebase auth
                await loadTokenAndHandleAuthFlow();
            } catch (e) {
                console.error("Firebase initialization failed:", e.message);
                console.warn("Falling back to localStorage for token persistence.");
                userId = 'local-user';
                await loadTokenAndHandleAuthFlow();
            }
        }

        // --- 2. SPOTIFY TOKEN MANAGEMENT (Persistent Storage) ---

        async function saveToken(tokenData) {
            if (db && userId) {
                const docRef = doc(db, TOKEN_DOC_PATH + userId, TOKEN_DOC_ID);
                await setDoc(docRef, tokenData);
            } else {
                // Fallback to localStorage
                localStorage.setItem('spotify_token', JSON.stringify(tokenData));
            }
        }

        async function loadToken() {
            if (db && userId) {
                const docRef = doc(db, TOKEN_DOC_PATH + userId, TOKEN_DOC_ID);
                const docSnap = await getDoc(docRef);
                return docSnap.exists() ? docSnap.data() : null;
            } else {
                // Fallback to localStorage
                const stored = localStorage.getItem('spotify_token');
                return stored ? JSON.parse(stored) : null;
            }
        }

        // --- 3. SPOTIFY API WRAPPER ---

        // Refresh access token using refresh token
        async function refreshAccessToken() {
            const tokenData = await loadToken();
            if (!tokenData || !tokenData.refreshToken) {
                throw new Error("No refresh token available. Please re-login.");
            }

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    client_id: SPOTIFY_CLIENT_ID,
                    grant_type: 'refresh_token',
                    refresh_token: tokenData.refreshToken,
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(`Token refresh failed: ${error.error_description || error.error}`);
            }

            const data = await response.json();
            
            const newTokenData = {
                accessToken: data.access_token,
                refreshToken: data.refresh_token || tokenData.refreshToken, // Keep old refresh token if new one not provided
                expiryTime: Date.now() + (data.expires_in * 1000)
            };
            
            await saveToken(newTokenData);
            return newTokenData;
        }

        async function spotifyApiCall(endpoint, method = 'GET', body = null) {
            let tokenData = await loadToken();
            if (!tokenData || !tokenData.accessToken) {
                throw new Error("Not authenticated. Please log in.");
            }

            // Check if token is expired or about to expire (within 5 minutes)
            if (tokenData.expiryTime && Date.now() >= tokenData.expiryTime - 300000) {
                console.log("Token expired or expiring soon, refreshing...");
                try {
                    tokenData = await refreshAccessToken();
                } catch (error) {
                    console.error("Token refresh failed:", error.message);
                    document.getElementById('status-message').textContent = "Session expired. Please re-login.";
                    document.getElementById('player-section').classList.add('hidden');
                    document.getElementById('auth-section').classList.remove('hidden');
                    throw error;
                }
            }

            const headers = {
                'Authorization': `Bearer ${tokenData.accessToken}`,
                'Content-Type': 'application/json'
            };

            const config = { method, headers };
            if (body) {
                config.body = JSON.stringify(body);
            }

            const response = await fetch(`https://api.spotify.com/v1${endpoint}`, config);

            if (response.status === 401) {
                // Try refreshing token once on 401
                console.log("Received 401, attempting token refresh...");
                try {
                    tokenData = await refreshAccessToken();
                    // Retry the request with new token
                    headers.Authorization = `Bearer ${tokenData.accessToken}`;
                    const retryResponse = await fetch(`https://api.spotify.com/v1${endpoint}`, config);
                    
                    if (!retryResponse.ok && retryResponse.status !== 204) {
                        throw new Error("Request failed after token refresh");
                    }
                    
                    if (retryResponse.status === 204) return null;
                    const contentType = retryResponse.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        return retryResponse.json();
                    }
                    return null;
                } catch (error) {
                    document.getElementById('status-message').textContent = "Session expired. Please re-login.";
                    document.getElementById('player-section').classList.add('hidden');
                    document.getElementById('auth-section').classList.remove('hidden');
                    throw new Error("Unauthorized. Please re-login.");
                }
            }
            if (response.status === 204) {
                return null; // No Content (successful action)
            }
            if (response.status === 404) {
                throw new Error("No active playback device found. Start playing on Spotify first.");
            }
            if (response.status === 403) {
                throw new Error("Playback action forbidden. You may need Spotify Premium.");
            }
            if (response.status === 405) {
                throw new Error("No active device. Start playback on a Spotify device first.");
            }
            if (!response.ok) {
                let errorMessage = response.statusText;
                try {
                    const errorBody = await response.json();
                    errorMessage = errorBody.error?.message || errorMessage;
                } catch (e) {
                    // Response is not JSON, use status text
                }
                throw new Error(`Spotify API error (${response.status}): ${errorMessage}`);
            }

            // Only try to parse JSON if there's content
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return response.json();
            }
            return null;
        }

        // --- 4. CORE EXTENSION FUNCTIONS ---

        // Function: Get Currently Playing Track (Shows what is playing)
        async function getCurrentlyPlaying() {
            try {
                const data = await spotifyApiCall('/me/player/currently-playing?market=from_token');

                const songNameEl = document.getElementById('song-name');
                const artistNameEl = document.getElementById('artist-name');
                const albumArtEl = document.getElementById('album-art');
                const albumArtWrapper = document.getElementById('album-art-wrapper');
                const playPauseIcon = document.getElementById('play-pause-icon');
                const progressBar = document.getElementById('progress-bar');
                const progressContainer = document.getElementById('progress-container');
                const timeDisplay = document.getElementById('time-display');
                const currentTimeEl = document.getElementById('current-time');
                const totalTimeEl = document.getElementById('total-time');
                const trackMetadata = document.getElementById('track-metadata');
                const albumNameEl = document.getElementById('album-name');
                const explicitBadge = document.getElementById('explicit-badge');

                if (!data || !data.is_playing || !data.item) {
                    songNameEl.textContent = "Nothing is playing.";
                    artistNameEl.textContent = "Start playback on a device first.";
                    albumNameEl.textContent = "";
                    document.getElementById('background-image').style.backgroundImage = 'none';
                    document.getElementById('progress-fill').style.width = '0%';
                    playPauseIcon.classList.remove('fa-pause');
                    playPauseIcon.classList.add('fa-play');
                    document.getElementById('play-pause-button').dataset.isPlaying = 'false';
                    document.title = 'Spotify Extension Core Simulator';
                    stopProgressUpdates();
                    return;
                }

                const songName = data.item.name;
                const artistName = data.item.artists.map(a => a.name).join(', ');
                const albumName = data.item.album?.name;
                const isPlaying = data.is_playing;
                const albumArt = data.item.album?.images?.[0]?.url;
                const progressMs = data.progress_ms || 0;
                const durationMs = data.item.duration_ms;
                const isExplicit = data.item.explicit;
                const trackUri = data.item.uri;
                const trackId = data.item.id;
                const artistId = data.item.artists[0]?.id; // Get first artist ID
                const albumId = data.item.album?.id;
                const totalAlbumTracks = data.item.album?.total_tracks;

                // If in fullscreen and artist changed, update background
                const artistChanged = currentArtistId && artistId && artistId !== currentArtistId;
                const albumChanged = currentAlbumId && albumId && albumId !== currentAlbumId;
                const trackChanged = currentTrackId && trackId && currentTrackId !== trackId;
                
                // Store artist ID for fullscreen mode
                currentArtistId = artistId;
                currentAlbumId = albumId;
                currentTrackId = trackId;

                // Update page title with currently playing song
                document.title = isPlaying 
                    ? ` ${songName} - ${artistName}`
                    : ` ${songName} - ${artistName}`;

                // Update local progress tracking
                localProgressMs = progressMs;
                lastUpdateTime = Date.now();

                songNameEl.textContent = songName;
                artistNameEl.textContent = artistName;
                
                // Display album name
                if (albumName) {
                    albumNameEl.textContent = albumName;
                } else {
                    albumNameEl.textContent = '';
                }

                // Update explicit badge
                updateExplicitBadge(isExplicit);

                // Display album art if available
                if (albumArt) {
                    albumArtEl.src = albumArt;
                    // Set background image (will be overridden in fullscreen mode)
                    if (!document.fullscreenElement) {
                        document.getElementById('background-image').style.backgroundImage = `url(${albumArt})`;
                    } else {
                        // In fullscreen: background is album art (heavy blur), artist img in panel
                        document.getElementById('background-image').style.backgroundImage = `url(${albumArt})`;
                    }
                    // Update fullscreen album art
                    document.getElementById('fs-album-art-img').src = albumArt;
                } else {
                    if (!document.fullscreenElement) {
                        document.getElementById('background-image').style.backgroundImage = 'none';
                    }
                }

                // Update fullscreen text info
                document.getElementById('fs-song-name').textContent = songName;
                document.getElementById('fs-artist-name').textContent = artistName;
                document.getElementById('fs-album-name').textContent = albumName || '';
                if (durationMs) {
                    document.getElementById('fs-time-total').textContent = formatTime(durationMs);
                }
                document.getElementById('fs-album-track-count').textContent = totalAlbumTracks
                    ? `${totalAlbumTracks} tracks`
                    : 'Track count unavailable';

                // If in fullscreen and artist changed, update background
                if (document.fullscreenElement && (artistChanged || albumChanged)) {
                    await updateFullscreenBackground();
                }

                // Update progress bar
                if (durationMs) {
                    const progressPercent = (progressMs / durationMs) * 100;
                    document.getElementById('progress-fill').style.width = `${progressPercent}%`;
                    document.getElementById('fs-progress-fill').style.width = `${progressPercent}%`;
                    document.getElementById('fs-time-current').textContent = formatTime(progressMs);
                    document.getElementById('play-pause-button').dataset.durationMs = durationMs;
                }

                const fullscreenPlayPauseIcon = document.getElementById('fs-play-pause-icon');
                const fullscreenPlayPauseButton = document.getElementById('fs-play-pause-btn');

                if (isPlaying) {
                    playPauseIcon.classList.remove('fa-play');

                        fullscreenPlayPauseIcon.classList.remove('fa-play');

                    startProgressUpdates();

                    if (fullscreenPlayPauseIcon) {
                        fullscreenPlayPauseIcon.classList.remove('fa-pause');
                        fullscreenPlayPauseIcon.classList.add('fa-play');
                    }
                    stopProgressUpdates();

                document.getElementById('play-pause-button').dataset.isPlaying = isPlaying ? 'true' : 'false';
                if (fullscreenPlayPauseButton) {
                    fullscreenPlayPauseButton.dataset.isPlaying = isPlaying ? 'true' : 'false';
                }

                document.getElementById('status-message').textContent = `Now controlling: ${songName} by ${artistName}`;

                if (trackChanged) {

                        document.documentElement.style.setProperty('--track-glow-rgb', rgb);

            } catch (error) {

        }

        // Helper function to format time from milliseconds to MM:SS
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatReleaseDate(releaseDate, precision) {
            if (!releaseDate) return 'Unknown';
            if (precision === 'year') return releaseDate;
            if (precision === 'month') {
                const [year, month] = releaseDate.split('-');
                return `${year}-${month}`;
            }
            return releaseDate;
        }

        function titleCase(value) {
            if (!value) return 'Unknown';
            return value.replace(/_/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
        }

        async function sampleImageGlowColor(imageUrl) {
            if (!imageUrl) return '29, 185, 84';

            try {
                const image = new Image();
                image.crossOrigin = 'anonymous';

                const color = await new Promise((resolve, reject) => {
                    image.onload = () => {
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d', { willReadFrequently: true });
                        if (!context) {
                            reject(new Error('Canvas context unavailable'));
                            return;
                        }

                        const sampleSize = 24;
                        canvas.width = sampleSize;
                        canvas.height = sampleSize;
                        context.drawImage(image, 0, 0, sampleSize, sampleSize);

                        const { data } = context.getImageData(0, 0, sampleSize, sampleSize);
                        let red = 0;
                        let green = 0;
                        let blue = 0;
                        let pixels = 0;

                        for (let index = 0; index < data.length; index += 4) {
                            red += data[index];
                            green += data[index + 1];
                            blue += data[index + 2];
                            pixels += 1;
                        }

                        const scale = 1 / Math.max(pixels, 1);
                        resolve(`${Math.round(red * scale)}, ${Math.round(green * scale)}, ${Math.round(blue * scale)}`);
                    };

                    image.onerror = reject;
                    image.src = imageUrl;
                });

                return color;
            } catch {
                return '29, 185, 84';
            }
        }

        // Function to update progress bar locally (between API calls)
        function updateLocalProgress() {
            const progressFill = document.getElementById('progress-fill');
            const fsProgressFill = document.getElementById('fs-progress-fill');
            const fsTimeCurrent = document.getElementById('fs-time-current');
            const button = document.getElementById('play-pause-button');
            const isPlaying = button.dataset.isPlaying === 'true';
            
            if (!isPlaying) return;
            
            const now = Date.now();
            const elapsed = now - lastUpdateTime;
            localProgressMs += elapsed;
            lastUpdateTime = now;
            
            const durationMs = parseInt(button.dataset.durationMs || 0);
            
            if (durationMs > 0) {
                const progressPercent = Math.min((localProgressMs / durationMs) * 100, 100);
                progressFill.style.width = `${progressPercent}%`;
                fsProgressFill.style.width = `${progressPercent}%`;
                fsTimeCurrent.textContent = formatTime(Math.min(localProgressMs, durationMs));
            }
        }

        // Start/stop local progress updates
        function startProgressUpdates() {
            if (progressInterval) clearInterval(progressInterval);
            lastUpdateTime = Date.now();
            progressInterval = setInterval(updateLocalProgress, 1000);
        }

        function stopProgressUpdates() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        // Function: Skip/Previous/Play/Pause Music
        async function controlPlayback(action) {
            try {
                // For pause/play, we need to use PUT instead of POST
                const method = (action === 'play' || action === 'pause') ? 'PUT' : 'POST';
                const endpoint = `/me/player/${action}`;
                await spotifyApiCall(endpoint, method);

                // Wait briefly for Spotify's state to update, then refresh the UI
                setTimeout(getCurrentlyPlaying, 500);

                // Show temporary success message
                document.getElementById('status-message').textContent = `Playback action: ${action.charAt(0).toUpperCase() + action.slice(1)} Successful!`;
                document.getElementById('error-box').classList.add('hidden');
                setTimeout(() => {
                    // Revert status message after 3 seconds
                    getCurrentlyPlaying();
                }, 3000);

            } catch (error) {
                // More specific error message for device issues
                if (error.message.includes('No active device') || error.message.includes('404')) {
                    displayError(`No active Spotify device found. Please:\n1. Open Spotify on any device (phone, desktop, web player)\n2. Start playing a song\n3. Then try again here`);
                } else {
                    displayError(`Failed to perform ${action}: ${error.message}`);
                }
            }
        }

        // Function: Toggle Play/Pause
        async function togglePlayback() {
            const button = document.getElementById('play-pause-button');
            const isPlaying = button.dataset.isPlaying === 'true';
            const action = isPlaying ? 'pause' : 'play';
            await controlPlayback(action);
        }

        // --- 5. AUTHENTICATION FLOW IMPLEMENTATION (PKCE) ---

        // PKCE helper functions
        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        }

        function base64encode(input) {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        }

        // Step 1: Redirect to Spotify login with PKCE
        async function handleLogin() {
            if (!SPOTIFY_CLIENT_ID || SPOTIFY_CLIENT_ID === '__SPOTIFY_CLIENT_ID__') {
                displayError("ERROR: Spotify Client ID not configured. Please set SPOTIFY_CLIENT_ID in .env file.");
                return;
            }

            const codeVerifier = generateRandomString(64);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            // Save code verifier for later use
            localStorage.setItem('code_verifier', codeVerifier);

            const authUrl = `https://accounts.spotify.com/authorize?` +
                `client_id=${SPOTIFY_CLIENT_ID}` +
                `&response_type=code` +
                `&redirect_uri=${encodeURIComponent(SPOTIFY_REDIRECT_URI)}` +
                `&scope=${encodeURIComponent(SCOPES)}` +
                `&code_challenge_method=S256` +
                `&code_challenge=${codeChallenge}`;

            document.getElementById('status-message').textContent = "Redirecting to Spotify...";
            window.location.href = authUrl;
        }

        // Logout function - clears all stored tokens and resets UI
        async function handleLogout() {
            try {
                // Clear token from storage
                if (db && userId) {
                    const docRef = doc(db, TOKEN_DOC_PATH + userId, TOKEN_DOC_ID);
                    await setDoc(docRef, {});
                }
                localStorage.removeItem('spotify_token');
                localStorage.removeItem('code_verifier');

                // Reset UI
                document.getElementById('player-section').classList.add('hidden');
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('refresh-btn').style.display = 'none';
                document.getElementById('logout-btn').classList.add('hidden');
                document.getElementById('qr-container').classList.add('hidden');
                document.getElementById('status-message').textContent = 'Logged out. Click to login again with updated permissions.';
                document.title = 'Spotify Extension Core Simulator';

                console.log('Logged out successfully');
            } catch (error) {
                console.error('Logout error:', error);
                displayError('Failed to logout: ' + error.message);
            }
        }

        // Exchange authorization code for access token
        async function exchangeCodeForToken(code) {
            const codeVerifier = localStorage.getItem('code_verifier');

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    client_id: SPOTIFY_CLIENT_ID,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: SPOTIFY_REDIRECT_URI,
                    code_verifier: codeVerifier,
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(`Token exchange failed: ${error.error_description || error.error}`);
            }

            const data = await response.json();
            localStorage.removeItem('code_verifier'); // Clean up

            return {
                accessToken: data.access_token,
                refreshToken: data.refresh_token,
                expiryTime: Date.now() + (data.expires_in * 1000)
            };
        }

        // Step 2: Handle redirect and token extraction (runs on page load)
        async function loadTokenAndHandleAuthFlow() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');

            if (error) {
                displayError(`Spotify authorization error: ${error}`);
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            if (code) {
                try {
                    document.getElementById('status-message').textContent = "Exchanging code for token...";
                    const tokenData = await exchangeCodeForToken(code);
                    await saveToken(tokenData);

                    // Clear the code from the URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch (error) {
                    displayError(error.message);
                    return;
                }
            }

            // Load token (either newly saved or from storage)
            const tokenData = await loadToken();

            if (tokenData && tokenData.accessToken) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('player-section').classList.remove('hidden');
                document.getElementById('refresh-btn').style.display = 'flex';
                document.getElementById('logout-btn').classList.remove('hidden');
                document.getElementById('error-box').classList.add('hidden');

                await getCurrentlyPlaying();

                // Optional: Set up an interval to refresh the current track automatically (like a real extension status bar)
                setInterval(getCurrentlyPlaying, 3000); // Refresh every 3 seconds
            } else {
                document.getElementById('status-message').textContent = "Ready. Click the button to log in.";
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('player-section').classList.add('hidden');
                document.getElementById('refresh-btn').style.display = 'none';
            }
        }

        // Toggle fullscreen mode
        async function toggleFullscreen() {
            const fullscreenIcon = document.getElementById('fullscreen-icon');
            
            if (!document.fullscreenElement) {
                // Enter fullscreen
                try {
                    await document.documentElement.requestFullscreen();
                    fullscreenIcon.classList.remove('fa-expand');
                    fullscreenIcon.classList.add('fa-compress');
                    
                    // Add fullscreen mode class
                    document.body.classList.add('fullscreen-mode');
                    
                    // Immediately set background to album art
                    const albumArt = document.getElementById('album-art').src;
                    if (albumArt) document.getElementById('background-image').style.backgroundImage = `url(${albumArt})`;
                    
                    // Fetch and populate artist card
                    await updateFullscreenBackground();
                    
                    // Request wake lock when entering fullscreen
                    await requestWakeLock();
                } catch (err) {
                    console.error('Error entering fullscreen:', err);
                }
            } else {
                // Exit fullscreen
                try {
                    await document.exitFullscreen();
                    fullscreenIcon.classList.remove('fa-compress');
                    fullscreenIcon.classList.add('fa-expand');
                    
                    // Remove fullscreen mode class
                    document.body.classList.remove('fullscreen-mode');
                    
                    // Restore album art background with blur
                    const albumArt = document.getElementById('album-art').src;
                    if (albumArt) {
                        document.getElementById('background-image').style.backgroundImage = `url(${albumArt})`;
                    }
                    
                    // Release wake lock when exiting fullscreen
                    releaseWakeLock();
                } catch (err) {
                    console.error('Error exiting fullscreen:', err);
                }
            }
        }

        // Request wake lock to prevent screen from sleeping
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock activated - screen will stay awake');
                    
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock released');
                    });
                } else {
                    console.warn('Wake Lock API not supported');
                }
            } catch (err) {
                console.error('Wake Lock error:', err);
            }
        }

        // Release wake lock
        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // Re-acquire wake lock when page becomes visible again
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', async () => {
            const fullscreenIcon = document.getElementById('fullscreen-icon');
            if (document.fullscreenElement) {
                fullscreenIcon.classList.remove('fa-expand');
                fullscreenIcon.classList.add('fa-compress');
                document.body.classList.add('fullscreen-mode');
                isFullscreenMode = true;
                // Immediately set background to album art
                const albumArtSrc = document.getElementById('album-art').src;
                if (albumArtSrc) document.getElementById('background-image').style.backgroundImage = `url(${albumArtSrc})`;
                await updateFullscreenBackground();
                requestWakeLock();
                // Show controls initially then hide after 3 seconds
                showFullscreenControls();
                hideFullscreenControlsAfterDelay();
            } else {
                fullscreenIcon.classList.remove('fa-compress');
                fullscreenIcon.classList.add('fa-expand');
                document.body.classList.remove('fullscreen-mode');
                isFullscreenMode = false;
                // Restore album art background
                const albumArt = document.getElementById('album-art').src;
                if (albumArt) {
                    document.getElementById('background-image').style.backgroundImage = `url(${albumArt})`;
                }
                releaseWakeLock();
            }
        });

        // Track cursor movement in fullscreen
        document.addEventListener('mousemove', handleCursorMovement);
        document.addEventListener('mouseenter', handleCursorMovement);

        // Handle cursor movement
        function handleCursorMovement() {
            if (!isFullscreenMode) return;
            
            showFullscreenControls();
            hideFullscreenControlsAfterDelay();
        }

        // Show fullscreen controls
        function showFullscreenControls() {
            document.body.classList.add('show-controls');
        }

        // Hide fullscreen controls
        function hideFullscreenControls() {
            document.body.classList.remove('show-controls');
        }

        // Hide controls after delay
        function hideFullscreenControlsAfterDelay() {
            if (cursorTimeout) {
                clearTimeout(cursorTimeout);
            }
            cursorTimeout = setTimeout(() => {
                if (isFullscreenMode) {
                    hideFullscreenControls();
                }
            }, 3000); // Hide after 3 seconds of inactivity
        }

        // --- NEW FEATURES ---

        // Generate QR Code for Spotify track
        async function generateQRCode(trackUri) {
            const qrContainer = document.getElementById('qr-code');
            const fullscreenQrContainer = document.getElementById('fs-qr-code');
            const spotifyUrl = `https://open.spotify.com/track/${trackUri.split(':')[2]}`;
            
            // Using Google Charts API for QR code generation
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(spotifyUrl)}`;
            if (qrContainer) {
                qrContainer.innerHTML = `<img src="${qrUrl}" alt="QR Code">`;
            }
            if (fullscreenQrContainer) {
                fullscreenQrContainer.innerHTML = `<img src="${qrUrl}" alt="QR Code">`;
            }
            
            document.getElementById('qr-container').classList.remove('hidden');
            const fullscreenQrBlock = document.getElementById('fs-qr-container');
            if (fullscreenQrBlock) {
                fullscreenQrBlock.classList.remove('hidden');
            }
        }

        // Show/hide explicit badge
        function updateExplicitBadge(isExplicit) {
            const badge = document.getElementById('explicit-badge');
            if (isExplicit) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // Fetch artist bio from Last.fm (free, no auth required)
        async function fetchArtistBio(artistName) {
            try {
                const encoded = encodeURIComponent(artistName);
                const url = `https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=${encoded}&api_key=c4b370e3a33bbdc0ec8c57cef7561dda&format=json&lang=en`;
                const res = await fetch(url);
                const data = await res.json();
                const bio = data?.artist?.bio?.summary;
                if (!bio) return null;
                // Strip Last.fm "Read more on Last.fm" link at end
                return bio.replace(/<a[^>]*>.*?<\/a>/gi, '').replace(/\s+$/, '').trim();
            } catch {
                return null;
            }
        }

        // Fetch artist details including high-res image, genres, popularity, followers
        async function fetchArtistDetails(artistId) {
            try {
                const artistData = await spotifyApiCall(`/artists/${artistId}`);
                if (!artistData) return null;
                currentArtistDetails = {
                    name: artistData.name,
                    imageUrl: artistData.images?.[0]?.url || null,
                    genres: artistData.genres || [],
                    followers: artistData.followers?.total || 0,
                    popularity: artistData.popularity || 0,
                    spotifyUrl: artistData.external_urls?.spotify || null
                };
                return currentArtistDetails;
            } catch (error) {
                console.error('Failed to fetch artist details:', error);
                return null;
            }
        }

        async function fetchAlbumDetails(albumId) {
            try {
                const albumData = await spotifyApiCall(`/albums/${albumId}?market=from_token`);
                if (!albumData) return null;
                currentAlbumDetails = {
                    name: albumData.name,
                    releaseDate: albumData.release_date,
                    releaseDatePrecision: albumData.release_date_precision,
                    label: albumData.label || 'Label unavailable',
                    totalTracks: albumData.total_tracks,
                    albumType: albumData.album_type || 'album'
                };
                return currentAlbumDetails;
            } catch (error) {
                console.error('Failed to fetch album details:', error);
                return null;
            }
        }

        async function fetchArtistTopTracks(artistId) {
            try {
                const topTracksData = await spotifyApiCall(`/artists/${artistId}/top-tracks?market=from_token`);
                currentArtistTopTracks = (topTracksData?.tracks || []).slice(0, 5).map(track => ({
                    name: track.name,
                    durationMs: track.duration_ms,
                    popularity: track.popularity,
                    albumName: track.album?.name || ''
                }));
                return currentArtistTopTracks;
            } catch (error) {
                console.error('Failed to fetch artist top tracks:', error);
                currentArtistTopTracks = [];
                return [];
            }
        }

        function updateFullscreenArtistDetails() {
            if (!currentArtistDetails) return;
            const genresEl = document.getElementById('fs-genres');
            const bigNameEl = document.getElementById('fs-artist-big-name');
            const bioEl = document.getElementById('fs-bio');
            if (bigNameEl) bigNameEl.textContent = currentArtistDetails.name;
            const topGenres = currentArtistDetails.genres.slice(0, 3);
            genresEl.innerHTML = topGenres.map(g => `<span class="genre-tag">${g}</span>`).join('');
            // Bio — fetch async and populate when ready
            if (bioEl) {
                bioEl.textContent = '';
                fetchArtistBio(currentArtistDetails.name).then(bio => {
                    bioEl.textContent = bio || '';
                });
            }
        }

        function updateFullscreenAlbumDetails() {
            if (!currentAlbumDetails) return;
            document.getElementById('fs-album-release').textContent = formatReleaseDate(
                currentAlbumDetails.releaseDate,
                currentAlbumDetails.releaseDatePrecision
            );
            document.getElementById('fs-album-type').textContent = titleCase(currentAlbumDetails.albumType);
            document.getElementById('fs-album-label').textContent = currentAlbumDetails.label;
            document.getElementById('fs-album-track-count').textContent = currentAlbumDetails.totalTracks
                ? `${currentAlbumDetails.totalTracks} tracks`
                : 'Track count unavailable';
        }

        function updateFullscreenTopTracks() {
            const listEl = document.getElementById('fs-top-track-list');
            if (!listEl) return;
            if (!currentArtistTopTracks.length) {
                listEl.innerHTML = '<div class="fs-top-track-meta">No top tracks available.</div>';
                return;
            }

            listEl.innerHTML = currentArtistTopTracks.map((track, index) => `
                <div class="fs-top-track-item">
                    <div class="fs-top-track-rank">${index + 1}</div>
                    <div>
                        <div class="fs-top-track-name">${track.name}</div>
                        <div class="fs-top-track-meta">${track.albumName}</div>
                    </div>
                    <div class="fs-top-track-meta">${formatTime(track.durationMs)}</div>
                </div>
            `).join('');
        }

        // Update fullscreen background (album art) and artist card
        async function updateFullscreenBackground() {
            if (document.fullscreenElement && currentArtistId) {
                // Set background to album art (blurred) immediately
                const albumArt = document.getElementById('fs-album-art-img').src;
                if (albumArt) {
                    document.getElementById('background-image').style.backgroundImage = `url(${albumArt})`;
                }
                // Fetch artist details and populate right panel
                const details = await fetchArtistDetails(currentArtistId);
                if (details?.imageUrl) {
                    currentArtistImage = details.imageUrl;
                    document.getElementById('fs-artist-img').src = details.imageUrl;
                }
                if (currentAlbumId) {
                    await fetchAlbumDetails(currentAlbumId);
                }
                await fetchArtistTopTracks(currentArtistId);
                updateFullscreenArtistDetails();
                updateFullscreenAlbumDetails();
                updateFullscreenTopTracks();
            }
        }

        // Start the application
        window.onload = initializeFirebase;
    </script>
